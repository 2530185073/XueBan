name: Android development build

on:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-checks.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Compile, test and lint network correction app
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Save development APK
        uses: actions/upload-artifact@v4
        with:
          name: xueban-network-dev
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Save lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: apps/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
